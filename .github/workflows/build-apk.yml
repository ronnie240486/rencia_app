name: Gerar APK (Ouro Pro / Maximus / etc.)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "maximus-player-source/**"

jobs:
  build:
    name: Build Android APK (nativo, sem Expo/EAS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maximus-player-source
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java (necessário pro Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto nativo Android (expo prebuild)
        run: npx expo prebuild --platform android --non-interactive
        env:
          EXPO_PUBLIC_BACKEND_URL: https://renciaapp-production.up.railway.app

      - name: Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar o APK
        working-directory: maximus-player-source/android
        run: ./gradlew assembleDebug

      - name: Publicar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: apk-gerado
          path: maximus-player-source/android/app/build/outputs/apk/debug/app-debug.apk
